server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Written when the container starts; browsers must not keep an old copy.
    location = /config.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # The pages name the hashed asset files of the current build.
    location ~* \.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location ^~ /media/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~* \.(?:css|js|mjs|map|json|png|jpg|jpeg|gif|svg|ico|webp|avif|woff|woff2|ttf|otf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
