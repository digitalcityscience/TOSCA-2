name: Build, publish, and deploy frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-frontend
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/digitalcityscience/tosca-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node from .nvmrc
        if: hashFiles('.nvmrc') != ''
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Node
        if: hashFiles('.nvmrc') == ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:main
          build-args: |
            VITE_BASE_URL=${{ vars.VITE_BASE_URL }}
            VITE_BACKEND_ROOT_URL=${{ vars.VITE_BACKEND_ROOT_URL }}
            VITE_GEONODE_REST_URL=${{ vars.VITE_GEONODE_REST_URL }}
            VITE_GEOSERVER_ROOT_URL=${{ vars.VITE_GEOSERVER_ROOT_URL }}
            VITE_GEOSERVER_BASE_URL=${{ vars.VITE_GEOSERVER_BASE_URL }}
            VITE_MAPTILER_API_KEY=${{ vars.VITE_MAPTILER_API_KEY }}
            VITE_INHOUSE_MAP_BASE_URL=${{ vars.VITE_INHOUSE_MAP_BASE_URL }}
            VITE_INHOUSE_MAP_API_KEY=${{ vars.VITE_INHOUSE_MAP_API_KEY }}
            VITE_MAP_START_LNG=${{ vars.VITE_MAP_START_LNG }}
            VITE_MAP_START_LAT=${{ vars.VITE_MAP_START_LAT }}
            VITE_MAP_START_ZOOM=${{ vars.VITE_MAP_START_ZOOM }}

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, ngcn, production]
    environment: production
    steps:
      - name: Deploy frontend
        run: |
          cd /opt/NGCN/tosca-deployment
          ./scripts/deploy-frontend.sh "${{ github.sha }}"
