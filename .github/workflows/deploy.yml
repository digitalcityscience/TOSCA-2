name: Trigger production deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, ngcn, production]
    steps:
      - name: Deploy TOSCA
        run: |
          cd "${TOSCA_DEPLOYMENT_DIR:-/opt/NGCN/TOSCA-Deployment}"
          ./deploy.sh
