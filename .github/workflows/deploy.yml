name: Deploy frontend

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, ngcn, production]
    steps:
      - name: Deploy local production stack
        run: |
          cd /opt/NGCN/TOSCA-Deployment
          ./deploy.sh
